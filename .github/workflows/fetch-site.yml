name: Fetch site (research)

# 只在研究用：把 haijiao.com 的首页 / bundle / 渲染后的开屏浮层抓回来。
# 不产出 ipa，不影响 Build iOS IPA。
#
# 为什么放 CI：haijiao.com 在这台机器上 DNS 被污染（解析到 31.13.x.x 假 IP），
# 443/80 都不通，只能借海外 runner 当抓取端。

on:
  push:
    paths:
      - '.github/workflows/fetch-site.yml'
      - 'scripts/fetch-site.mjs'
      - 'scripts/fetch-site2.mjs'
      - 'scripts/fetch-site3.mjs'
      - 'scripts/perf-probe.mjs'
      - 'scripts/scroll-probe.mjs'
      - 'scripts/tti-probe.mjs'
      - 'scripts/api-probe.mjs'
      - 'scripts/detail-probe.mjs'
      - 'scripts/detail2-probe.mjs'
      - 'scripts/detail3-probe.mjs'
      - 'scripts/detail4-probe.mjs'
      - 'scripts/detail5-probe.mjs'
      - 'scripts/api-detail-probe.mjs'
      - 'scripts/img-probe.mjs'
      - 'scripts/img2-probe.mjs'
      - 'scripts/img3-probe.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装 playwright + chromium
        run: |
          npm i --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: 抓取
        run: node scripts/fetch-site.mjs

      - name: 去广告 A/B 实验
        run: node scripts/fetch-site2.mjs

      - name: 网页端彻底去广告（C 组）
        run: node scripts/fetch-site3.mjs

      - name: 首屏性能 A/B
        run: node scripts/perf-probe.mjs

      - name: 滚动诊断
        run: node scripts/scroll-probe.mjs

      - name: 首屏可交互时间（CPU 4x）
        run: node scripts/tti-probe.mjs

      - name: 接口契约抓取（原生改造用）
        run: node scripts/api-probe.mjs

      - name: 详情路由验证
        run: node scripts/detail-probe.mjs

      - name: 详情接口契约（原生化用）
        run: node scripts/detail2-probe.mjs

      - name: 详情 URL 形式探测
        run: node scripts/detail3-probe.mjs

      - name: 详情真实点击探测
        run: node scripts/detail4-probe.mjs

      - name: 详情坐标点击探测
        run: node scripts/detail5-probe.mjs

      - name: 详情/评论接口直打
        run: node scripts/api-detail-probe.mjs

      - name: 图片请求头探测
        run: node scripts/img-probe.mjs

      - name: 图片编码拆解
        run: node scripts/img2-probe.mjs

      - name: 网页图片 DOM 取证
        run: node scripts/img3-probe.mjs

      - name: 摘要
        if: always()
        run: |
          echo "--- out 目录 ---"
          ls -laR out | head -60 || true
          echo "--- 浮层数量 ---"
          for f in out/overlays-*.json; do echo "$f: $(grep -c '"path"' "$f" 2>/dev/null || echo 0)"; done
          echo "--- A/B 结果 ---"
          ls -la out2/ out3/ out4/ out5/ out6/ out7/ out8/ out9/ out10/ out11/ out12/ out13/ out14/ out15/ out16/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-dump-${{ github.run_number }}
          path: |
            out/
            out2/
            out3/
            out4/
            out5/
            out6/
            out7/
            out8/
            out9/
            out10/
            out11/
            out12/
            out13/
            out14/
            out15/
            out16/
          if-no-files-found: warn
          retention-days: 14
